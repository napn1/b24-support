<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Портал сопровождения</title>
  <!-- Стили -->
  <link rel="stylesheet" href="styles.css?v=20260519">
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <!-- Иконка чата -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
      </svg>
      <h1>Портал сопровождения</h1>
      <p>Войдите чтобы продолжить</p>
    </div>

    <div class="login-card">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="your@email.com"
          autocomplete="email"
          autofocus
        />
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input
          type="password"
          id="password"
          placeholder="••••••••••"
          autocomplete="current-password"
        />
      </div>
      <button class="btn-login" id="btnLogin" onclick="doLogin()">Войти</button>
      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script>
    // Если уже авторизован — редирект на чат
    if (B24_AUTH.getSession()) {
      window.location.href = 'chat.html';
    }

    // Войти по Enter
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
    document.getElementById('email').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('password').focus();
    });

    async function doLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('btnLogin');
      const errEl    = document.getElementById('errorMsg');

      errEl.classList.remove('visible');

      if (!email || !password) {
        showError('Введите email и пароль');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Вход...';

      const result = await B24_AUTH.login(email, password);

      if (result.success) {
        window.location.href = 'chat.html';
      } else {
        showError(result.error || 'Ошибка входа');
        btn.disabled = false;
        btn.textContent = 'Войти';
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.add('visible');
    }
  </script>
</body>
</html>
