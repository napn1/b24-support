<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Чат сопровождения</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0e0e0e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ─── HEADER ─── */
    .chat-header {
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .company-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5b9cf6, #4a8de0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      color: #fff;
    }

    .company-info h2 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .company-info p {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }

    .subscription-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
    }

    .subscription-badge.active {
      background: #1a3a1a;
      color: #4ade80;
    }

    .subscription-badge.expiring {
      background: #3a1a1a;
      color: #f87171;
    }

    .subscription-badge.expired {
      background: #2a2a2a;
      color: #666;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid #333;
      color: #aaa;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      border-color: #555;
      color: #fff;
    }

    /* ─── MESSAGES ─── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.client {
      align-self: flex-end;
      background: #5b9cf6;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.specialist {
      align-self: flex-start;
      background: #2a2a2a;
      color: #e0e0e0;
      border-bottom-left-radius: 4px;
    }

    .message-time {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
      text-align: right;
    }

    .message.specialist .message-time {
      color: #666;
    }

    .message-file {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      margin-top: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .message-file:hover {
      background: rgba(0,0,0,0.3);
    }

    .message-file svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .message-file span {
      font-size: 13px;
    }

    .message-image {
      margin-top: 6px;
      border-radius: 8px;
      max-width: 100%;
      cursor: pointer;
    }

    /* ─── INPUT ─── */
    .chat-input-wrap {
      background: #1a1a1a;
      border-top: 1px solid #2a2a2a;
      padding: 14px 20px;
      flex-shrink: 0;
    }

    .chat-input-container {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-box {
      flex: 1;
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      color: #e0e0e0;
      resize: none;
      outline: none;
      max-height: 120px;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .input-box:focus {
      border-color: #5b9cf6;
    }

    .input-box::placeholder {
      color: #555;
    }

    .btn-attach, .btn-send {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .btn-attach {
      background: #2a2a2a;
      color: #aaa;
    }

    .btn-attach:hover {
      background: #333;
      color: #fff;
    }

    .btn-send {
      background: #5b9cf6;
      color: #fff;
    }

    .btn-send:hover {
      background: #4a8de0;
    }

    .btn-send:disabled {
      background: #2a4a7a;
      cursor: not-allowed;
    }

    .btn-attach svg, .btn-send svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* ─── LOADER ─── */
    .loader {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 13px;
    }

    .spinner-small {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #5b9cf6;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── MOBILE ─── */
    @media (max-width: 768px) {
      .message { max-width: 85%; }
      .chat-header { padding: 12px 16px; }
      .chat-messages { padding: 16px; }
      .chat-input-wrap { padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="chat-header">
    <div class="header-left">
      <div class="company-avatar" id="companyAvatar">?</div>
      <div class="company-info">
        <h2 id="companyName">Загрузка...</h2>
        <p id="userName">—</p>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <div class="subscription-badge active" id="subBadge">Загрузка...</div>
      <button class="btn-logout" onclick="B24_AUTH.logout()">Выйти</button>
    </div>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="chatMessages">
    <div class="loader">
      <span class="spinner-small"></span>Загрузка сообщений...
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input-wrap">
    <div class="chat-input-container">
      <button class="btn-attach" onclick="attachFile()" title="Прикрепить файл">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
        </svg>
      </button>
      <textarea
        class="input-box"
        id="messageInput"
        placeholder="Напишите сообщение..."
        rows="1"
      ></textarea>
      <button class="btn-send" id="btnSend" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <input type="file" id="fileInput" style="display:none" onchange="handleFileSelect()" />

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="chat-client.js"></script>
</body>
</html>
