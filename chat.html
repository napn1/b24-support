<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Чат сопровождения</title>
  <!-- Стили -->
  <link rel="stylesheet" href="styles.css?v=20260519">
</head>
<body>
  <!-- Header -->
  <div class="chat-header">
    <div class="header-left">
      <div class="company-avatar" id="companyAvatar">?</div>
      <div class="company-info">
        <h2 id="companyName">Загрузка...</h2>
        <p id="userName">—</p>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <div class="subscription-badge active" id="subBadge">Загрузка...</div>
      <button class="btn-logout" onclick="B24_AUTH.logout()">Выйти</button>
    </div>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="chatMessages">
    <div class="loader">
      <span class="spinner-small"></span>Загрузка сообщений...
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input-wrap">
    <div class="chat-input-container">
      <button class="btn-attach" onclick="attachFile()" title="Прикрепить файл">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
        </svg>
      </button>
      <textarea
        class="input-box"
        id="messageInput"
        placeholder="Напишите сообщение..."
        rows="1"
      ></textarea>
      <button class="btn-send" id="btnSend" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <input type="file" id="fileInput" style="display:none" onchange="handleFileSelect()" />

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="chat-client.js"></script>
</body>
</html>
